name: Publish compiled Off-Script playtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Download verified compiled playtest
        run: |
          curl -L --fail --retry 3 -o /tmp/playtest.zip 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8d00-81f5-9927-f204c80ba17f/raw?se=2026-09-27T06%3A10%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=282e7ff5-e6d6-55cc-9d39-4f575fee23b4&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T13%3A20%3A23Z&ske=2026-09-27T13%3A20%3A23Z&sks=b&skv=2026-02-06&sig=mZe5M1LJ/Uv71qw0joXMsIWeZ6WawYLM7lVeZNnm/dc%3D'
          rm -rf /tmp/site /tmp/wrapped
          mkdir -p /tmp/site /tmp/wrapped
          unzip -q /tmp/playtest.zip -d /tmp/wrapped
          tar -xf /tmp/wrapped/artifact.tar -C /tmp/site
          sed -i 's#/Cloud-Agent-Sandbox/#./#g' /tmp/site/index.html
          sed -i 's#/Cloud-Agent-Sandbox/#./#g' /tmp/site/assets/*.js
          rm -f /tmp/site/assets/*.map
          touch /tmp/site/.nojekyll

      - name: Publish compiled files into this public repo
        run: |
          rm -rf assets index.html .nojekyll
          cp -R /tmp/site/assets ./assets
          cp /tmp/site/index.html ./index.html
          cp /tmp/site/.nojekyll ./.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No compiled changes to publish."
            exit 0
          fi
          git commit -m "publish: compiled Off-Script playtest"
          git push
